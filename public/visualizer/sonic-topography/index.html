<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>音域回响 · Sonic Topography</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
    </style>
    <script>
      // 立即注册 Wallpaper Engine Media Integration 回调
      // 必须在脚本加载时立即注册，不能延迟到 onload 或模块加载后
      window.__mediaState = {
        title: '',
        artist: '',
        thumbnail: '',
        primaryColor: '',
        textColor: '',
        isPlaying: false,
        position: 0,
        duration: 0,
        _callbacks: []
      };

      window.__notifyMediaChange = function() {
        window.__mediaState._callbacks.forEach(function(cb) {
          cb({
            title: window.__mediaState.title,
            artist: window.__mediaState.artist,
            thumbnail: window.__mediaState.thumbnail,
            primaryColor: window.__mediaState.primaryColor,
            textColor: window.__mediaState.textColor,
            isPlaying: window.__mediaState.isPlaying,
            position: window.__mediaState.position,
            duration: window.__mediaState.duration
          });
        });
      };

      if (window.wallpaperRegisterMediaPropertiesListener) {
        window.wallpaperRegisterMediaPropertiesListener(function(props) {
          window.__mediaState.title = props.title || '';
          window.__mediaState.artist = props.artist || '';
          window.__mediaState.position = 0;
          window.__mediaState.duration = 0;
          window.__notifyMediaChange();
        });
      }

      if (window.wallpaperRegisterMediaThumbnailListener) {
        window.wallpaperRegisterMediaThumbnailListener(function(thumb) {
          window.__mediaState.thumbnail = thumb.thumbnail || '';
          window.__mediaState.primaryColor = thumb.primaryColor || '';
          window.__mediaState.textColor = thumb.textColor || '';
          window.__notifyMediaChange();
        });
      }

      if (window.wallpaperRegisterMediaPlaybackListener) {
        window.wallpaperRegisterMediaPlaybackListener(function(pb) {
          var PLAYING = (window.wallpaperMediaIntegration && window.wallpaperMediaIntegration.PLAYBACK_PLAYING) || 0;
          window.__mediaState.isPlaying = pb.state === PLAYING;
          window.__notifyMediaChange();
        });
      }

      if (window.wallpaperRegisterMediaTimelineListener) {
        window.wallpaperRegisterMediaTimelineListener(function(tl) {
          window.__mediaState.position = tl.position || 0;
          window.__mediaState.duration = tl.duration || 0;
          window.__notifyMediaChange();
        });
      }
    </script>
    <!-- VoiceHub 适配层：在非 Wallpaper Engine 环境注入音频/媒体接口，
         由宿主页面（全屏播放器「体素主题」）通过 postMessage 桥接真实播放器的 FFT 与歌曲信息 -->
    <script>
      window.__vhAudioCb = null;
      window.__vhMediaCbs = [];
      window.wallpaperRegisterAudioListener = function (cb) {
        window.__vhAudioCb = cb;
      };
      window.wallpaperRegisterMediaPropertiesListener = function (cb) {
        window.__vhMediaCbs.push(cb);
      };
      window.addEventListener('message', function (e) {
        var d = e.data || {};
        if (d.type === 'vh-audio' && window.__vhAudioCb) {
          try { window.__vhAudioCb(Float32Array.from(d.data)); } catch (err) {}
        } else if (d.type === 'vh-media') {
          window.__vhMediaCbs.forEach(function (cb) {
            try { cb({ title: d.title || '', artist: d.artist || '' }); } catch (err) {}
          });
          if (window.__mediaState) {
            window.__mediaState.title = d.title || '';
            window.__mediaState.artist = d.artist || '';
            window.__mediaState.isPlaying = !!d.isPlaying;
            if (d.cover) window.__mediaState.thumbnail = d.cover;
            if (window.__notifyMediaChange) window.__notifyMediaChange();
          }
        }
      });

      // 画质下调①：渲染像素比
      // 资源包用 react-three-fiber，其 Canvas 的 dpr 默认 [1,2]，会按 window.devicePixelRatio
      // 取上限 —— 在缩放 200% 的高分屏上等于按 2 倍分辨率渲染，片元数翻两番。
      // 本站是低多边形体素风，压到 1 倍观感差别很小，填充率却降 75%。
      // 本页面（iframe 内）全局只有 r3f 那一处读 devicePixelRatio，所以改写是安全的；
      // 想恢复原生像素比，删掉这一段即可（点击交互按 CSS 像素计算，不受影响）。
      (function () {
        try {
          Object.defineProperty(window, 'devicePixelRatio', {
            configurable: true,
            get: function () { return 1 }
          });
        } catch (err) {}
      })();

      // 站点侧参数注入
      // Wallpaper Engine 里这些参数（见 project.json 的 general.properties）由引擎经
      // wallpaperPropertyListener.applyUserProperties 下发，资源包据此覆盖内置默认值。
      // 本站没有引擎，不喂的话可视化会一直用内置默认（渲染精度 160 / 波纹灵敏度 .22 /
      // 流星灵敏度 .4）。
      // 资源包对「组件尚未挂载时收到的属性」有缓存（挂载后 et(eg) 补应用），
      // 所以这里只需等 window.wallpaperPropertyListener 出现，执行时机不敏感。
      (function () {
        var VH_USER_PROPERTIES = {
          // 渲染精度：即画质。档位 120/160/320/640/1080/4096，内置默认 160。
          // 场景世界尺寸固定 168，gridSize 是「每边体素数」，体素总数 = gridSize²
          // （160 → 25,600 个方块，120 → 14,400，约少 44%），取最低档。
          gridSize: { value: 120 },
          // 波纹灵敏度：滑块范围 0.05~0.5，取最大 → 节拍触发阈值最低、波纹最敏感
          pulseSensitivity: { value: 0.5 },
          // 流星灵敏度：滑块范围 0.1~0.8，取最大 → 流星出现最积极
          meteorSensitivity: { value: 0.8 }
        };
        var attempts = 0;
        (function applyWhenReady() {
          var listener = window.wallpaperPropertyListener;
          if (listener && typeof listener.applyUserProperties === 'function') {
            try {
              listener.applyUserProperties(VH_USER_PROPERTIES);
            } catch (err) {}
            return;
          }
          // 模块脚本尚未执行：约 16ms 重试一次，最多约 10 秒
          if (++attempts < 600) setTimeout(applyWhenReady, 16);
        })();
      })();
    </script>

    <link rel="stylesheet" crossorigin href="assets/index-DgmMz9-g.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
